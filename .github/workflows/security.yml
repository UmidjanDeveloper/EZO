name: Security

# Dependency audits. Separate from CI so a newly published advisory does not block unrelated
# work; it still fails visibly (red run) and runs weekly. See docs/SECURITY.md.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main, "claude/**", "fix/p0-final-hardening-p1-readiness", "fix/p0-parser-process-final", "feat/p1-student-durable-jobs", "fix/p1-student-job-source-budgets", "fix/p1-student-audit-remediation", "feat/p0-p1-controlled-student-foundation", "feat/per-document-isolated-executor", "fix/executor-admission-recovery", "feat/student-v1-complete", "feat/zero-budget-private-beta", "feat/free-beta-storage-profile", "feat/full-owner-beta-budget", "feat/master-build-candidate", "feat/final-backend-completion", "feat/jarvis-eight-upstream-integration", "feat/knowledge-refresh-governance", "feat/master-durable-refresh", "feat/final-backend-acceptance", "feat/humanoid-perception", "fix/reference-voice-experience", "fix/immersive-robot-stage"]
    paths:
      - 'ROADMAP.md'
      - 'IMPLEMENTATION_STATUS.md'
      - 'docs/master/**'
      - 'docs/integration/**'
      - "apps/api/Dockerfile"
      - "docker-compose.yml"
      - "apps/api/src/**"
      - "apps/api/tests/**"
      - "tests/e2e/**"
      - "packages/perception-client/**"
      - "docs/master/**"
      - "apps/web/Dockerfile"
      - "apps/web/app/**"
      - "apps/web/components/**"
      - "apps/web/lib/**"
      - "apps/api/pyproject.toml"
      - "apps/api/uv.lock"
      - "pnpm-lock.yaml"
      - "**/package.json"
      - ".github/workflows/security.yml"
      - ".github/workflows/ci.yml"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
      - name: Export the locked runtime dependencies
        run: uv export --frozen --no-dev --no-hashes --no-emit-project > requirements-audit.txt
      - name: Audit against known vulnerabilities (PyPI advisory database / OSV)
        run: |
          mkdir -p reports/security
          uvx pip-audit==2.10.1 -r requirements-audit.txt --progress-spinner off \
            --format json --output reports/security/pip-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: python-dependency-security
          path: apps/api/reports/security/

  node:
    name: Node dependencies (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (high and critical fail)
        run: |
          mkdir -p reports/security
          pnpm audit --prod --audit-level high --json > reports/security/node-production.json
      - name: Development dependencies (reported separately, not a production gate)
        if: always()
        continue-on-error: true
        run: pnpm audit --json > reports/security/node-all.json
      - name: Packaged Electron is runtime even when listed as a devDependency
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/security/node-all.json").read_text())
          findings = [
              item for item in report["advisories"].values()
              if item["module_name"] == "electron" and item["severity"] in {"high", "critical"}
          ]
          for item in findings:
              print("Packaged Electron vulnerability:", item["github_advisory_id"],
                    "patched:", item["patched_versions"])
          raise SystemExit(bool(findings))
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: node-dependency-security
          path: reports/security/

  images:
    name: Container images (Trivy, fixable high and critical CVEs fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t ezo-api:scan apps/api
      - name: Bundled and system TLS trust reject the compromised emSign root
        run: |
          docker run --rm --network=none --read-only --interactive --entrypoint python \
            ezo-api:scan - < apps/api/tests/unit/test_tls_trust.py
      - name: Build the actual isolated OCR and Office executor for security scanning
        run: docker build --pull=false --build-arg API_IMAGE=ezo-api:scan -f apps/api/src/ezo_api/documents/executor/Dockerfile -t ezo-executor:scan apps/api
      - run: docker build -t ezo-web:scan -f apps/web/Dockerfile .
      - name: Scan OS packages and libraries in API, executor and web images
        run: |
          mkdir -p reports/security
          for component in api executor web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/reports/security:/reports" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
              image --db-repository ghcr.io/aquasecurity/trivy-db:2 --skip-version-check \
              --scanners vuln --format json --output "/reports/$component.trivy.json" \
              --no-progress "ezo-$component:scan"
          done
      - name: The known web zlib advisory is patched, not suppressed
        run: |
          python3 - <<'PYCODE'
          import json
          with open("reports/security/web.trivy.json") as source:
              report = json.load(source)
          assert not any(
              finding["VulnerabilityID"] == "CVE-2026-85091"
              for result in report.get("Results", [])
              for finding in result.get("Vulnerabilities", [])
          ), "Known zlib security update was not applied"
          PYCODE
      - name: Report all findings and enforce the fixable HIGH/CRITICAL gate
        if: always()
        run: python3 scripts/container_vulnerability_gate.py reports/security/api.trivy.json reports/security/executor.trivy.json reports/security/web.trivy.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: container-vulnerability-reports
          path: reports/security/
