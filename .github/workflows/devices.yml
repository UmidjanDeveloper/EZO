name: Devices

# Builds the installable EZO apps on real operating systems and records what actually
# happened there. Nothing is published, signed with production keys or deployed.
on:
  push:
    branches: ["claude/**", "feat/final-backend-acceptance"]
    paths: ["apps/desktop/**", "apps/mobile/**", "tests/e2e/devices/**", ".github/workflows/devices.yml", "pnpm-lock.yaml"]
  pull_request:
    paths: ["apps/desktop/**", "apps/mobile/**", "tests/e2e/devices/**", ".github/workflows/devices.yml", "pnpm-lock.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Windows desktop (installer + real OS self-test)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ezo/desktop...
      - name: Unit tests
        run: pnpm --filter @ezo/desktop test
      - name: Build the NSIS installer (unsigned)
        env:
          EZO_BUILD_SHA: ${{ github.sha }}
        run: pnpm --filter @ezo/desktop run dist:win
      - name: Install silently, as a user would
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release -Filter "EZO-Setup-*.exe" | Select-Object -First 1
          if (-not $setup) { throw "installer missing" }
          "installer: $($setup.Name) $([math]::Round($setup.Length / 1MB, 1)) MB" | Tee-Object -FilePath $env:RUNNER_TEMP/install.txt
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "EZO.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "EZO.exe was not installed under %LOCALAPPDATA%\Programs" }
          "installed: $($exe.FullName)" | Tee-Object -FilePath $env:RUNNER_TEMP/install.txt -Append
          "EZO_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real Windows self-test (Calculator, file search, dictation, volume keys, screenshot)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "selftest.json"
          $folder = Join-Path $env:RUNNER_TEMP "ezo-allowed"
          $p = Start-Process $env:EZO_EXE -ArgumentList "--self-test=$report", "--self-test-folder=$folder" -Wait -PassThru
          Get-Content $report
          Copy-Item (Join-Path $folder "screen.png") $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "self-test exit code $($p.ExitCode)" }
      - name: Uninstall silently, as a user would, and verify nothing is left
        shell: pwsh
        run: |
          $dir = Split-Path $env:EZO_EXE
          $uninstaller = Join-Path $dir "Uninstall EZO.exe"
          if (-not (Test-Path $uninstaller)) { throw "uninstaller missing in $dir" }
          Start-Process $uninstaller -ArgumentList "/S" -Wait
          # The NSIS uninstaller copies itself to %TEMP% and finishes from there.
          $gone = $false
          foreach ($i in 1..30) { if (-not (Test-Path $env:EZO_EXE)) { $gone = $true; break }; Start-Sleep -Seconds 2 }
          if (-not $gone) { throw "EZO.exe still present after uninstall" }
          $shortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "EZO.lnk"
          "uninstalled: EZO.exe removed; desktop shortcut present after uninstall: $(Test-Path $shortcut)" | Tee-Object -FilePath $env:RUNNER_TEMP/install.txt -Append
          if (Test-Path $shortcut) { throw "desktop shortcut left behind" }
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ezo-windows
          path: |
            apps/desktop/release/EZO-Setup-*.exe
            ${{ runner.temp }}/selftest.json
            ${{ runner.temp }}/install.txt
            ${{ runner.temp }}/install.txt
            ${{ runner.temp }}/screen.png
          retention-days: 14

  android-apk:
    name: Android debug APK (build, then install and drive it on an emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      EZO_TOKEN: emulator-ci-token-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ezo/mobile...
      - name: Unit tests and type check
        run: pnpm --filter @ezo/mobile test && pnpm --filter @ezo/mobile typecheck
      - name: Build the web layer and sync it into the Android project
        working-directory: apps/mobile
        env:
          EZO_ANDROID_ALLOW_LAN_HTTP: "1" # debug test build: may reach an EZO server on the LAN
        run: |
          export EZO_BUILD_SHA="${{ github.sha }}"
          pnpm build && pnpm exec cap sync android
      - name: Gradle assembleDebug (JDK 21, runner's Android SDK)
        working-directory: apps/mobile/android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Inspect the APK (package, SDK levels, permissions)
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$apk"
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt2" dump badging "$apk" | grep -E "^package|sdkVersion|uses-permission|application-label" | tee "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$apk" | tee -a "$RUNNER_TEMP/apk-badging.txt"
          version=$(node -p "require('./apps/mobile/package.json').version")
          cp "$apk" "$RUNNER_TEMP/EZO-$version-debug.apk"
          cp "$apk" "$RUNNER_TEMP/EZO-debug.apk" # kept for the emulator step below
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ezo-android
          path: |
            ${{ runner.temp }}/EZO-*-debug.apk
            ${{ runner.temp }}/apk-badging.txt
          retention-days: 14
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
      - name: Install the Playwright Android driver
        run: pnpm install --frozen-lockfile --filter @ezo/e2e...
      - name: Start a real EZO API (token mode, offline AI, SQLite)
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/emulator.db
          EZO_STORAGE_DIR: ${{ runner.temp }}/storage
          EZO_ENV: test
          EZO_AUTH_MODE: token
          EZO_API_TOKEN: ${{ env.EZO_TOKEN }}
          EZO_CORS_ORIGINS: https://localhost
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          nohup uv run uvicorn ezo_api.main:create_app --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot an Android 34 emulator (headless)
        timeout-minutes: 20
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          # avdmanager and the emulator must agree on where AVDs live.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          note() { echo "::notice title=Android emulator::$*"; }
          # Logs are not always readable, so the evidence goes into annotations too.
          fail() {
            echo "::error title=Android emulator::$*"
            for f in sdkmanager.log avdmanager.log emulator.log; do
              [ -s "$RUNNER_TEMP/$f" ] || continue
              tail -12 "$RUNNER_TEMP/$f" | tr -d '\r' | grep -v '^[[:space:]]*$' | while IFS= read -r line; do
                echo "::warning title=$f::${line:0:400}"
              done
            done
            exit 1
          }
          ls -l /dev/kvm || fail "no /dev/kvm on this runner"
          yes | sdkmanager --licenses > /dev/null || true
          timeout 600 sdkmanager --install "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" \
            > "$RUNNER_TEMP/sdkmanager.log" 2>&1 || { tail -20 "$RUNNER_TEMP/sdkmanager.log"; fail "sdkmanager install failed"; }
          note "system image installed"
          echo no | avdmanager create avd -n ezo -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force \
            > "$RUNNER_TEMP/avdmanager.log" 2>&1 || fail "avdmanager could not create the AVD"
          emulator -list-avds | grep -qx ezo || fail "the emulator does not see the AVD (found: $(emulator -list-avds | tr '\n' ' '))"
          nohup emulator -avd ezo -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel on \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 10
          kill -0 "$emulator_pid" 2>/dev/null || fail "the emulator process exited right after start"
          timeout 300 adb wait-for-device || fail "emulator did not appear in adb within 5 minutes"
          note "emulator visible to adb"
          booted=""
          for i in $(seq 1 120); do
            if [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          [ -n "$booted" ] || fail "Android did not finish booting within 10 minutes"
          note "booted Android $(adb shell getprop ro.build.version.release | tr -d '\r')"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Install the APK built by the previous job
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          adb install -r "$RUNNER_TEMP/EZO-debug.apk"
          adb shell pm list packages | grep uz.ezo.mobile
      - name: Drive the real app (connect, shared conversation, send from phone)
        env:
          EZO_API: http://127.0.0.1:8000
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$RUNNER_TEMP/android-shots"
          node tests/e2e/devices/android-smoke.mjs "$RUNNER_TEMP/android-report.json" "$RUNNER_TEMP/android-shots"
      - name: Crash check (logcat)
        if: always()
        timeout-minutes: 3
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          # adb waits forever for a device; skip when the emulator never came up.
          if ! adb devices | grep -q "device$"; then echo "No emulator attached; nothing to check."; exit 0; fi
          timeout 60 adb logcat -d > "$RUNNER_TEMP/logcat.txt" || true
          if grep -E "FATAL EXCEPTION.*|Process: uz.ezo.mobile" "$RUNNER_TEMP/logcat.txt" | grep -q "uz.ezo.mobile"; then
            grep -A20 "FATAL EXCEPTION" "$RUNNER_TEMP/logcat.txt" | head -60
            exit 1
          fi
      - name: Report
        if: always()
        run: |
          cat "$RUNNER_TEMP/android-report.json" || true
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "android-report.json")
          try:
              report = json.load(open(path))
          except Exception:
              report = {"ok": False, "steps": []}
          # GitHub keeps at most 10 notices per step: the verdict first, then the latest steps.
          print(f"::notice title=Android emulator::ok={report['ok']} steps={len(report['steps'])} "
                + " → ".join(s["name"] for s in report["steps"])[:700])
          for s in report["steps"][-8:]:
              print(f"::notice title=Android step::{s['name']} {s.get('detail','')}"[:900])
          if report.get("error"):
              first = " ".join(report["error"].split())
              print(f"::error title=Android smoke failed::{first}"[:1800])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ezo-android-emulator
          path: |
            ${{ runner.temp }}/android-report.json
            ${{ runner.temp }}/android-shots/
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/emulator.log
          retention-days: 14

