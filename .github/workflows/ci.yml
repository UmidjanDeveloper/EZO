name: CI

on:
  push:
    branches: [main, "claude/**", "fix/p0-final-hardening-p1-readiness", "fix/p0-parser-process-final", "feat/p1-student-durable-jobs", "fix/p1-student-job-source-budgets", "fix/p1-student-audit-remediation", "feat/p0-p1-controlled-student-foundation", "feat/per-document-isolated-executor", "fix/executor-admission-recovery", "feat/student-v1-complete", "feat/zero-budget-private-beta", "feat/free-beta-storage-profile", "feat/full-owner-beta-budget"]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, built from source with the runner's Go)
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.21.2
      - name: No credentials in any commit (.gitleaksignore lists reviewed test fixtures)
        run: '"$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner .'

  api:
    name: API (lint, types, tests on SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ezo
          POSTGRES_PASSWORD: ezo
          POSTGRES_DB: ezo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ezo -d ezo_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
      - name: Tesseract OCR (uzb, uzb_cyrl, rus, eng) and LibreOffice (real OCR and PDF tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-osd \
            tesseract-ocr-eng tesseract-ocr-rus tesseract-ocr-uzb tesseract-ocr-uzb-cyrl \
            libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui \
            fonts-liberation fonts-dejavu-core libseccomp2
          tesseract --version && tesseract --list-langs && soffice --version
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations ../../scripts
      - run: uv run ruff format --check src tests migrations ../../scripts
      - run: uv run mypy
      - name: Tests (SQLite)
        run: uv run pytest -q -rs --junitxml=reports/sqlite.xml
        env:
          EZO_REQUIRE_TESSERACT: "1"
          EZO_REQUIRE_OFFICE: "1"
      - name: Tests (PostgreSQL)
        run: uv run pytest -q -rs --junitxml=reports/postgres.xml
        env:
          EZO_TEST_DATABASE_URL: postgresql://ezo:ezo@localhost:5432/ezo_test
          EZO_REQUIRE_TESSERACT: "1"
          EZO_REQUIRE_OFFICE: "1"
      - name: Migrations are in sync with the models
        run: uv run alembic upgrade head && uv run alembic check
        env:
          DATABASE_URL: postgresql://ezo:ezo@localhost:5432/ezo_test
      - name: Test report (exact numbers for IMPLEMENTATION_STATUS)
        if: always()
        working-directory: .
        run: >-
          python3 scripts/test_report.py
          "API · SQLite=apps/api/reports/sqlite.xml"
          "API · PostgreSQL=apps/api/reports/postgres.xml"

  web:
    name: Web (lint, types, unit tests, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests
        run: pnpm test --reporter=default --reporter=junit --outputFile=reports/vitest.xml
      - run: pnpm build:web
      - run: uv sync --frozen
        working-directory: apps/api
      - run: pnpm --filter @ezo/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Test report (exact numbers for IMPLEMENTATION_STATUS)
        if: always()
        run: >-
          python3 scripts/test_report.py
          "Web unit=apps/web/reports/vitest.xml"
          "Shared unit=packages/shared/reports/vitest.xml"
          "Playwright e2e=tests/e2e/reports/junit.xml"

  docker:
    name: Docker (API + web images, Compose config, API smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compose file is valid (optional profiles included)
        run: docker compose --profile voice --profile student config --quiet
      - name: Build API image
        run: docker build -t ezo-api:ci apps/api
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.32"
      - name: Install isolated controller regression dependencies
        working-directory: apps/api
        run: uv sync --frozen
      - name: Per-document isolation, hostile descendants, OOM, cancellation and controller crash
        run: apps/api/.venv/bin/python scripts/test_isolated_executor.py --api-image ezo-api:ci
      - name: Isolated executor report
        if: always()
        run: python3 scripts/test_report.py "Isolated executor=apps/api/reports/isolated-executor.xml"
      - name: Production image fails closed without a native executor
        run: |
          docker run --rm --entrypoint python ezo-api:ci -c "
          import shutil
          from ezo_api.documents.isolation import IsolationUnavailable
          from ezo_api.documents.process_limits import run_native
          from ezo_api.documents.office_convert import OfficeConverter
          assert shutil.which('tesseract') is None
          assert shutil.which('soffice') is None
          assert OfficeConverter.discover() is None
          try:
              run_native(['/bin/true'], timeout=1, file_limit=1024, stdout_limit=1024)
          except IsolationUnavailable:
              pass
          else:
              raise AssertionError('Native execution unexpectedly enabled')
          "
      - name: Office tests pass with the image's own LibreOffice version
        # Preserve native regression coverage in the controlled fixture target.
        # Production contains neither this toolchain nor the fixture test harness.
        run: |
          docker build --target office-tests -t ezo-api-office:ci apps/api
          langs=$(docker run --rm --entrypoint tesseract ezo-api-office:ci --list-langs)
          for l in uzb uzb_cyrl rus eng osd; do echo "$langs" | grep -qx "$l"; done
          docker run --rm --user 10001 -e EZO_REQUIRE_OFFICE=1 -e EZO_REQUIRE_TESSERACT=1 \
            -v "$PWD/apps/api/tests:/app/tests:ro" --entrypoint sh ezo-api-office:ci -c \
            "python -m pytest -q -p no:cacheprovider \
              tests/unit/test_office_convert.py tests/unit/test_office_safety.py \
              tests/unit/test_process_limits.py tests/unit/test_ocr.py \
              tests/unit/test_native_execution.py tests/unit/test_office_parse_limits.py \
              tests/integration/test_office_pdf.py"
      - name: Native fixture children are reaped by tini
        run: |
          docker run --rm --memory=1536m --user 10001 \
            -v "$PWD/apps/api/tests/container_native_reaping.py:/tmp/check-reaping.py:ro" \
            ezo-api-office:ci python /tmp/check-reaping.py
      - name: Build web image
        run: docker build -t ezo-web:ci -f apps/web/Dockerfile .
      - name: Web runtime includes the patched zlib package
        run: |
          docker run --rm --entrypoint sh ezo-web:ci -c '
            version=$(apk info -v zlib)
            version=${version#zlib-}
            test "$(apk version -t "$version" 1.3.2-r1)" != "<"
          '
      - name: Unsafe production configuration fails before HTTP startup
        run: |
          if docker run --rm -e EZO_ENV=production ezo-api:ci; then
            echo "Unsafe production configuration was accepted"
            exit 1
          fi
      - name: A hosting platform without EZO_ENV=production is refused
        run: |
          if docker run --rm -e RENDER=true ezo-api:ci; then
            echo "API started on a hosting platform without the production policy"
            exit 1
          fi
      - name: Migration failure prevents HTTP startup
        run: |
          if docker run --rm -e EZO_ENV=test -e DATABASE_URL=sqlite:////proc/ezo-unwritable.db ezo-api:ci; then
            echo "API started despite a failed migration"
            exit 1
          fi
      - name: API image migrates, authenticates and retains files across restart
        run: |
          export EZO_API_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker volume create ezo-ci-storage
          docker run -d --name ezo-api -p 8000:8000 \
            -v ezo-ci-storage:/app/storage \
            -e DATABASE_URL=sqlite:////app/storage/ci.db -e EZO_ENV=test \
            -e EZO_AUTH_MODE=token -e EZO_API_TOKEN ezo-api:ci
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health 2>/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs ezo-api; exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/me)" = 401
          curl -fsS -o /dev/null -H "Authorization: Bearer ${EZO_API_TOKEN}" http://localhost:8000/api/me
          docker exec ezo-api python -c "
          import asyncio
          from ezo_api.settings import Settings
          from ezo_api.storage.local import LocalStorageProvider
          asyncio.run(LocalStorageProvider(Settings().storage_dir).put('ci/persistence.txt', b'persistent'))
          "
          docker restart ezo-api
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health 2>/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs ezo-api; exit 1; fi
          docker exec ezo-api python -c "
          import asyncio
          from ezo_api.settings import Settings
          from ezo_api.storage.local import LocalStorageProvider
          assert asyncio.run(LocalStorageProvider(Settings().storage_dir).get('ci/persistence.txt')) == b'persistent'
          "
      - name: Web image starts and serves the app
        run: |
          docker run -d --name ezo-web -p 3000:3000 -e EZO_API_URL=http://localhost:8000 ezo-web:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/ 2>/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs ezo-web
          exit 1
