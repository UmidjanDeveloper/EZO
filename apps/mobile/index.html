<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11131b" />
    <title>EZO</title>
  </head>
  <body>
    <header>
      <span class="logo">EZO</span>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <span id="dot" class="dot" role="status" title=""></span>
    </header>

    <main>
      <section id="welcomeTab" data-tab="welcome" hidden>
        <div class="welcome">
          <div class="welcome-face"><canvas id="welcomeAvatar" aria-hidden="true"></canvas></div>
          <h1 data-i18n="welcome.title"></h1>
          <p data-i18n="welcome.body"></p>
          <p data-i18n="welcome.needs"></p>
          <p class="muted" data-i18n="welcome.privacy"></p>
          <label><span data-i18n="more.language"></span>
            <select id="welcomeLanguage" aria-label="Language"></select>
          </label>
          <button id="welcomeStart" data-i18n="welcome.start"></button>
        </div>
      </section>

      <section id="chatTab" data-tab="chat">
        <p id="offlineBanner" class="banner" hidden data-i18n="chat.offlineBanner"></p>
        <div class="row">
          <select id="conversation" aria-label=""></select>
          <button id="refresh" class="ghost" aria-label="">⟳</button>
        </div>
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <button type="button" id="document" class="ghost" aria-label="">📄</button>
          <button type="button" id="camera" class="ghost" aria-label="">📷</button>
          <input id="input" placeholder="" autocomplete="off" maxlength="4000" />
          <button type="submit" id="send" class="ghost" aria-label="">➤</button>
          <button type="button" id="mic" class="mic" aria-label="">🎤</button>
        </form>
      </section>

      <section data-tab="tasks" hidden>
        <h2 data-i18n="tasks.title"></h2>
        <p class="muted" data-i18n="tasks.note"></p>
        <form id="taskForm" class="row">
          <input id="taskText" placeholder="" maxlength="2000" />
          <button data-i18n="tasks.create"></button>
        </form>
        <p id="taskCapabilities" class="muted"></p>
        <ul id="taskList" class="list"></ul>
      </section>

      <section data-tab="learn" hidden>
        <h2 data-i18n="ielts.title"></h2>
        <p class="muted" data-i18n="ielts.note"></p>
        <div id="ieltsStart" class="stack">
          <label><span data-i18n="ielts.cueCard"></span>
            <select id="cueCard"></select>
          </label>
          <button id="ieltsBegin" data-i18n="ielts.start"></button>
          <p id="ieltsHistory" class="muted"></p>
        </div>
        <div id="ieltsRun" class="stack" hidden>
          <p id="ieltsPart" class="muted"></p>
          <p id="ieltsPrompt" class="prompt"></p>
          <p id="ieltsHeard" class="muted"></p>
          <form id="ieltsForm" class="stack">
            <textarea id="ieltsAnswer" rows="4" placeholder=""></textarea>
            <div class="row">
              <button type="button" id="ieltsMic" class="ghost"></button>
              <button type="submit" id="ieltsSubmit" data-i18n="ielts.submit"></button>
            </div>
          </form>
          <p id="ieltsStatus" class="muted" role="status"></p>
          <div id="ieltsMetrics" class="card" hidden></div>
          <div id="ieltsDone" class="card" hidden></div>
          <button type="button" id="ieltsNew" class="ghost" data-i18n="ielts.newSession" hidden></button>
        </div>
      </section>

      <section data-tab="files" hidden>
        <h2 data-i18n="files.title"></h2>
        <p class="muted" data-i18n="files.note"></p>
        <ul id="fileList" class="list"></ul>
      </section>

      <section data-tab="more" hidden>
        <h2 data-i18n="more.projects"></h2>
        <p class="muted" data-i18n="more.projectsNote"></p>
        <form id="addProject" class="row">
          <input id="projectName" placeholder="" maxlength="120" />
          <button data-i18n="more.addProject"></button>
        </form>
        <ul id="projectList" class="list"></ul>

        <h2 data-i18n="more.memory"></h2>
        <form id="addMemory" class="row">
          <input id="memoryInput" placeholder="" maxlength="1000" />
          <button data-i18n="more.add"></button>
        </form>
        <ul id="memoryList" class="list"></ul>

        <h2 data-i18n="more.reminder"></h2>
        <form id="reminder" class="stack">
          <input id="reminderText" placeholder="" maxlength="200" />
          <input id="reminderAt" type="datetime-local" />
          <button data-i18n="more.setReminder"></button>
        </form>

        <h2 data-i18n="more.settings"></h2>
        <label><span data-i18n="more.serverUrl"></span> <input id="apiUrl" inputmode="url" placeholder="https://api.sizning-domen.uz" /></label>
        <label><span data-i18n="more.token"></span> <input id="token" type="password" autocomplete="off" placeholder="" /></label>
        <label><span data-i18n="more.language"></span>
          <select id="language"></select>
        </label>
        <label class="check"><input id="speakReplies" type="checkbox" /> <span data-i18n="more.speakReplies"></span></label>
        <label class="check"><input id="lowPower" type="checkbox" /> <span data-i18n="more.lowPower"></span></label>
        <label><span data-i18n="more.voiceVolume"></span> <input id="voiceVolume" type="range" min="0" max="1" step="0.05" /></label>
        <div class="row">
          <button id="saveSettings" data-i18n="more.saveConnect"></button>
          <button id="clearToken" class="ghost" data-i18n="more.clearToken"></button>
        </div>
        <p class="muted" data-i18n="more.settingsNote"></p>
        <button id="showWelcome" class="ghost" data-i18n="more.showWelcome"></button>

        <details id="diagnostics">
          <summary data-i18n="more.diagnostics"></summary>
          <p class="muted" data-i18n="more.diagnosticsNote"></p>
          <pre id="diagnosticsText" class="diag"></pre>
          <div class="row">
            <button type="button" id="diagnosticsRefresh" class="ghost" data-i18n="more.diagnosticsRefresh"></button>
            <button type="button" id="diagnosticsCopy" data-i18n="more.diagnosticsCopy"></button>
            <span id="diagnosticsState" class="muted" role="status"></span>
          </div>
        </details>
      </section>
    </main>

    <section id="voiceStage" class="stage" hidden aria-label="">
      <div id="avatarBox" class="avatar-box"><canvas id="avatar"></canvas></div>
      <div class="stage-top">
        <div class="langs" role="group" aria-label="">
          <button type="button" data-lang="auto"></button>
          <button type="button" data-lang="uz">UZ</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ru">RU</button>
        </div>
        <button type="button" id="stageClose" class="round" aria-label="">✕</button>
      </div>
      <div class="stage-text">
        <div class="clap-row">
          <span id="clapState" class="clap-state" role="status" data-microphone="off"></span>
          <button type="button" id="clapToggle" class="link"></button>
          <span id="microphoneIndicator" class="indicator"></span>
          <span id="clapHeard" class="clap-heard"></span>
        </div>
        <label class="check small"><input id="clapStartsListening" type="checkbox" /> <span id="clapStartsListeningLabel"></span></label>
        <p id="clapPrivacy" class="privacy"></p>
        <p id="stageStatus" class="stage-status" aria-live="polite"></p>
        <p id="stageHeard" class="stage-heard"></p>
        <p id="stageReply" class="stage-reply"></p>
      </div>
      <button type="button" id="stageMic" class="mic big" aria-label="">🎤</button>
    </section>

    <nav>
      <button data-go="chat" data-i18n="nav.chat"></button>
      <button data-go="tasks" data-i18n="nav.tasks"></button>
      <button data-go="learn" data-i18n="nav.learn"></button>
      <button data-go="files" data-i18n="nav.files"></button>
      <button data-go="more" data-i18n="nav.more"></button>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
