<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <title>EZO OS JARVIS</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 320px; margin: 12px; color: #1f2328; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      label { display: block; margin-top: 8px; }
      input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 2px; }
      button { margin-top: 10px; padding: 6px 10px; }
      #status { margin-top: 10px; }
      .muted { color: #57606a; font-size: 12px; }
      li { margin: 4px 0; }
    </style>
  </head>
  <body>
    <h1>EZO OS JARVIS</h1>
    <p class="muted">
      Bu kengaytma sahifalarni o‘qimaydi va hech qanday amal bajarmaydi. U faqat EZO API’dagi haqiqiy
      imkoniyatlar holatini ko‘rsatadi.
    </p>
    <label>EZO API manzili (https)<input id="apiUrl" placeholder="https://api.example.com" /></label>
    <label>API token<input id="token" type="password" autocomplete="off" /></label>
    <button id="save">Saqlash va tekshirish</button>
    <div id="status" role="status"></div>
    <ul id="features"></ul>
    <script src="popup.js"></script>
  </body>
</html>
