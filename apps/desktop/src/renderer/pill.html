<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self'; style-src 'self'; media-src blob:; img-src 'self' data:"
    />
    <title>EZO</title>
    <link rel="stylesheet" href="pill.css" />
  </head>
  <body>
    <main id="pill" class="pill idle" aria-live="polite">
      <button id="orb" class="orb" aria-label="EZO">
        <span class="ring"></span><span class="core"></span>
        <canvas id="face" class="face"></canvas>
      </button>
      <div class="status">
        <strong id="label">EZO</strong>
        <span id="hint"></span>
      </div>
      <span id="dot" class="dot" role="status" title=""></span>
      <span id="media" class="media" role="status" aria-live="polite"></span>
      <button id="expand" class="icon" aria-label="" aria-pressed="false">⤢</button>
      <button id="keyboard" class="icon" aria-label="">⌨</button>
      <button id="history" class="icon" aria-label="">☰</button>
      <button id="stop" class="icon" aria-label="" hidden>■</button>
      <button id="gear" class="icon" aria-label="">⚙</button>
    </main>
    <!-- The expanded stage: EZO's full humanoid, the voice frame and the camera controls. -->
    <section id="stage" class="stage" hidden>
      <div class="stage-view">
        <canvas id="stageFace" class="stage-face"></canvas>
        <div id="stageFrame" class="stage-frame"></div>
      </div>
      <p id="attention" class="attention" aria-live="polite"></p>
      <video id="perceptionVideo" class="hidden-video" muted playsinline aria-hidden="true"></video>
      <div class="camera-row">
        <span id="cameraState" class="camera-state" role="status" data-camera="off"></span>
        <button type="button" id="cameraToggle" class="link"></button>
        <span id="cameraIndicator" class="indicator"></span>
      </div>
      <p id="cameraPrivacy" class="privacy"></p>
      <div class="camera-row">
        <span id="clapState" class="camera-state" role="status" data-microphone="off"></span>
        <button type="button" id="clapToggle" class="link"></button>
        <span id="microphoneIndicator" class="indicator"></span>
        <span id="clapHeard" class="clap-heard"></span>
      </div>
      <p id="clapPrivacy" class="privacy"></p>
    </section>
    <section id="panel" class="panel" hidden>
      <form id="ask">
        <input id="question" maxlength="4000" placeholder="" autocomplete="off" />
      </form>
      <p id="task" class="task" hidden><span id="taskText"></span> <button type="button" id="cancelTask" class="link"></button></p>
      <div id="historyView" class="history" hidden>
        <div class="history-head">
          <select id="conversations" aria-label=""></select>
          <button type="button" id="newConversation" class="link"></button>
        </div>
        <ol id="messages" class="messages"></ol>
      </div>
      <p id="transcript" class="transcript"></p>
      <p id="reply" class="reply"></p>
    </section>
    <script src="pill.js"></script>
  </body>
</html>
