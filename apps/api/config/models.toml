# EZO model routing configuration.
#
# Each route is a kind of work. Its candidates are tried top to bottom:
# EZO uses the first candidate whose provider has an API key in .env, and if
# that provider fails before answering, it falls back to the next one.
#
# Set EZO_PREFERRED_PROVIDER=openai|anthropic|gemini in .env to move that
# provider to the front of every route without editing this file.
#
# Model names change over time. If a provider returns "model not found",
# check the provider's model list and update the name here:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/models
#   OpenAI:    https://developers.openai.com/api/docs/models
#   Gemini:    https://ai.google.dev/gemini-api/docs/models
#
# effort (optional): low | medium | high — how much the model should reason.

[defaults]
max_output_tokens = 16000

[routes.chat]
description = "Everyday conversation: fast and inexpensive"

[[routes.chat.candidates]]
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"

[[routes.chat.candidates]]
provider = "openai"
model = "gpt-5.6-luna"
effort = "low"

[[routes.chat.candidates]]
provider = "gemini"
model = "gemini-3.6-flash"
effort = "low"

[routes.reasoning]
description = "Deep reasoning, planning, analysis"

[[routes.reasoning.candidates]]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"

[[routes.reasoning.candidates]]
provider = "openai"
model = "gpt-5.6-sol"
effort = "high"

[[routes.reasoning.candidates]]
provider = "gemini"
model = "gemini-3.1-pro-preview"
effort = "high"

[routes.coding]
description = "Programming and code review"

[[routes.coding.candidates]]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"

[[routes.coding.candidates]]
provider = "openai"
model = "gpt-5.6-sol"
effort = "high"

[[routes.coding.candidates]]
provider = "gemini"
model = "gemini-3.1-pro-preview"
effort = "high"

[routes.long_context]
description = "Long documents and large inputs"

[[routes.long_context.candidates]]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"

[[routes.long_context.candidates]]
provider = "gemini"
model = "gemini-3.1-pro-preview"

[[routes.long_context.candidates]]
provider = "openai"
model = "gpt-5.6-sol"
effort = "medium"

[routes.vision]
description = "Images and scans (used from Milestone 4)"

[[routes.vision.candidates]]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"

[[routes.vision.candidates]]
provider = "openai"
model = "gpt-5.6-sol"

[[routes.vision.candidates]]
provider = "gemini"
model = "gemini-3.6-flash"

[routes.research]
description = "Research answers that compare and cite sources"

[[routes.research.candidates]]
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "medium"

[[routes.research.candidates]]
provider = "openai"
model = "gpt-5.6-sol"
effort = "medium"

[[routes.research.candidates]]
provider = "gemini"
model = "gemini-3.1-pro-preview"

# Embeddings turn text into vectors for semantic search (knowledge base and
# memory). The first provider with an API key is used for everything.
# Anthropic has no embeddings API, so add an OpenAI or Gemini key for
# semantic search; without one EZO still finds documents by keywords.
# If you change the model later, press "Reindex" on the Knowledge page.

[[embeddings.candidates]]
provider = "openai"
model = "text-embedding-3-small"

[[embeddings.candidates]]
provider = "gemini"
model = "gemini-embedding-001"
