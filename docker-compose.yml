# EZO local stack: PostgreSQL + API + web.
#
#   docker compose up --build      start everything (first run builds images)
#   docker compose up -d db        start only the database (for `python scripts/ezo.py dev`)
#   docker compose down            stop (data is kept in the "ezo-db" volume)
#
# Secrets (API keys) come from the .env file in this folder.

services:
  db:
    # PostgreSQL 16 with the pgvector extension, ready for Milestone 2 (vector search).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ezo
      POSTGRES_PASSWORD: ezo
      POSTGRES_DB: ezo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ezo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezo -d ezo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://ezo:ezo@db:5432/ezo
      EZO_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      EZO_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ezo-db:
