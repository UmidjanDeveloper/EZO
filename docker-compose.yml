# EZO local stack: PostgreSQL + API + web.
#
#   docker compose up --build      start everything (first run builds images)
#   docker compose up -d db        start only the database (for `python scripts/ezo.py dev`)
#   docker compose down            stop (data is kept in the "ezo-db" and "ezo-storage" volumes)
#
#   docker compose --profile voice up   also start the optional VoiceStudio voice service
#
# Secrets (API keys) come from the .env file in this folder.

services:
  db:
    # PostgreSQL 16 with the pgvector extension (vector search for files and memories).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ezo
      POSTGRES_PASSWORD: ezo
      POSTGRES_DB: ezo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ezo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezo -d ezo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://ezo:ezo@db:5432/ezo
      EZO_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ezo-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 128

  # Explicit local stored-text consumer; never a native parser worker.
  student-worker:
    build: ./apps/api
    profiles: [student]
    # Consumer exits on failure; the API HTTP probe is not a worker health check.
    healthcheck:
      disable: true
    command: [python, -m, ezo_api.knowledge.jobs.worker, --worker-id, student-local-1]
    environment:
      DATABASE_URL: postgresql+psycopg://ezo:ezo@db:5432/ezo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      EZO_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional server-side voice (speech-to-text + text-to-speech). VoiceStudio is a separate
  # AGPL-3.0 project; EZO talks to it only over its HTTP API (see docs/OPEN_SOURCE_AUDIT.md).
  # Its default voice model weights are licensed for NON-COMMERCIAL use only.
  # The first start downloads several GB of models. Enable with:
  #   1. in .env: VOICESTUDIO_URL=http://voicestudio:3900 and VOICESTUDIO_API_KEY=<long random text>
  #   2. docker compose --profile voice up
  voicestudio:
    image: ghcr.io/debpalash/voicestudio:stable
    profiles: ["voice"]
    expose:
      - "3900" # reachable by the EZO API inside Docker only; not published on your network
    volumes:
      - voicestudio-data:/app/omnivoice_data
    environment:
      HF_HOME: /app/omnivoice_data/huggingface
      OMNIVOICE_DATA_DIR: /app/omnivoice_data
      OMNIVOICE_SERVER_MODE: "1"
      OMNIVOICE_API_KEY: ${VOICESTUDIO_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3900/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: unless-stopped

volumes:
  ezo-db:
  ezo-storage:
  voicestudio-data:
