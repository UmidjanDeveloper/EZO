# PAID REFERENCE ONLY — NOT authorized by the zero-budget private-beta decision.
# Deliberately outside the root render.yaml discovery path. Do not import/provision.
# See docs/ZERO_BUDGET_PRIVATE_BETA.md for the current BLOCKED hosting assessment.
# Creating this service incurs charges. No automatic deployments.
services:
  - type: web
    name: ezo-api
    runtime: docker
    plan: standard
    region: frankfurt
    # Deploy only a reviewed commit with green CI (manual deploys take the branch tip).
    branch: claude/gifted-goodall-bpf01s
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    numInstances: 1
    healthCheckPath: /api/health
    disk:
      name: ezo-files
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: PORT
        value: "10000"
      - key: EZO_ENV
        value: production
      - key: EZO_AUTH_MODE
        value: token
      - key: EZO_API_TOKEN
        generateValue: true
      - key: EZO_DEBUG_TRACES
        value: "false"
      - key: EZO_LOG_LEVEL
        value: INFO
      - key: EZO_FETCH_ALLOW_PRIVATE_NETWORKS
        value: "false"
      - key: EZO_STORAGE_DIR
        value: /app/storage
      - key: EZO_VECTOR_STORE
        value: pgvector
      - key: DATABASE_URL
        sync: false
      - key: EZO_CORS_ORIGINS
        sync: false
      # Daily cap on calls that may reach a paid AI provider; set provider limits too.
      - key: EZO_RATE_LIMIT_CHAT_PER_DAY
        value: "1000"
      # AI provider keys: entered in the Render dashboard, never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
