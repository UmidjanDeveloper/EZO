# REVIEW-ONLY candidate, NOT permission to provision. Current Free terms unverified.
# Stop if the dashboard does not explicitly confirm $0/no paid add-ons.
# No disk, background worker, pre-deploy task, secret generation or auto deployment.
services:
  - type: web
    name: ezo-free-beta-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: claude/gifted-goodall-bpf01s
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: EZO_ENV
        value: production
      - key: EZO_DEPLOYMENT_PROFILE
        value: free-beta
      - key: EZO_AUTH_MODE
        value: token
      - key: EZO_API_TOKEN
        sync: false
      - key: EZO_DEBUG_TRACES
        value: "false"
      - key: EZO_LOG_LEVEL
        value: INFO
      - key: EZO_CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EZO_VECTOR_STORE
        value: pgvector
      - key: EZO_STORAGE_PROVIDER
        value: supabase
      - key: EZO_SUPABASE_URL
        sync: false
      - key: EZO_SUPABASE_STORAGE_KEY
        sync: false
      - key: EZO_SUPABASE_STORAGE_BUCKET
        value: ezo-private
      - key: EZO_STORAGE_MAX_BYTES
        value: "5000000"
      - key: EZO_STORAGE_DIR
        value: /tmp/ezo-scratch
      - key: EZO_FETCH_ALLOW_PRIVATE_NETWORKS
        value: "false"
      - key: EZO_LEARNING_ENABLED
        value: "false"
      - key: EZO_RUFLO_ENABLED
        value: "false"
      - key: EZO_WEB_SEARCH_PROVIDER
        value: none
      - key: EZO_SCHOLAR_PROVIDER
        value: none
      - key: EZO_VOICE_PROVIDERS
        value: none
      - key: EZO_IMAGE_PROVIDERS
        value: none
      - key: EZO_OCR_PROVIDER
        value: none
      - key: EZO_OFFICE_CONVERTER
        value: none
      - key: EZO_MAX_UPLOAD_MB
        value: "4"
      - key: EZO_MAX_MESSAGE_CHARS
        value: "4000"
      - key: EZO_RATE_LIMIT_CHAT
        value: "5"
      - key: EZO_RATE_LIMIT_CHAT_PER_DAY
        value: "10"
      - key: EZO_RATE_LIMIT_DEFAULT
        value: "60"
