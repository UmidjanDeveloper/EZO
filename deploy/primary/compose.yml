# EZO primary host (Architecture A: one owner-controlled Linux VPS) — REVIEW CANDIDATE.
# Not a deployment: nothing here is started by CI or by any hosting integration.
#
#   Caddy (TLS, ports 80/443 only) -> web (Next.js) and api (FastAPI)
#   api / stored-text worker / refresh worker -> db (PostgreSQL 16 + pgvector, TLS verify-full)
#
# Native Student parsing (PDF/DOCX/EPUB), OCR and Office conversion are NOT here: they need
# the separate executor host (docs/deployment/EXECUTOR_REQUIREMENTS.md). Do not add them.
#
# Prepare once on the host (secrets never enter Git):
#   ./bootstrap-secrets.sh           # DB/app passwords, API token, DB TLS CA + server cert
#   cp primary.env.example primary.env && edit domains/provider keys
#   docker compose --env-file primary.env up -d --build
name: ezo-primary

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-api-env: &api-env
  env_file: [primary.env]
  environment:
    # The app role, never the postgres superuser; TLS with hostname + CA verification.
    DATABASE_URL: postgresql+psycopg://ezo_app:${EZO_DB_APP_PASSWORD:?run bootstrap-secrets.sh}@db:5432/ezo?sslmode=verify-full&sslrootcert=/run/ezo-db-tls/ca.crt
    EZO_API_TOKEN: ${EZO_API_TOKEN:?run bootstrap-secrets.sh}

services:
  db:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    <<: *hardening
    read_only: false # PostgreSQL writes its data directory and runtime files
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID] # entrypoint drops to the postgres user
    environment:
      POSTGRES_DB: ezo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EZO_DB_ADMIN_PASSWORD:?run bootstrap-secrets.sh}
      EZO_DB_APP_PASSWORD: ${EZO_DB_APP_PASSWORD:?run bootstrap-secrets.sh}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/ezo-db-tls/server.crt
      - -c
      - ssl_key_file=/run/ezo-db-tls/server.key
      - -c
      - shared_buffers=192MB
      - -c
      - max_connections=40
    volumes:
      - ezo-db:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./secrets/db-tls:/run/ezo-db-tls:ro
    # No published port: only the API and workers on the private network reach it.
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ezo"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    shm_size: 128m

  api:
    build: { context: ../../apps/api }
    image: ${EZO_API_IMAGE:-ezo-api:local}
    <<: [*hardening, *api-env]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    volumes:
      - ezo-storage:/app/storage
      - ./secrets/db-tls/ca.crt:/run/ezo-db-tls/ca.crt:ro
    networks: [backend, edge]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 128

  # Durable stored-text consumer (Student TXT/MD jobs). Never a native parser.
  student-worker:
    image: ${EZO_API_IMAGE:-ezo-api:local}
    <<: [*hardening, *api-env]
    command: [python, -m, ezo_api.knowledge.jobs.worker, --worker-id, primary-text-1]
    healthcheck: { disable: true }
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    volumes:
      - ./secrets/db-tls/ca.crt:/run/ezo-db-tls/ca.crt:ro
    networks: [backend]
    depends_on:
      api: { condition: service_healthy } # the API owns migrations
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    stop_grace_period: 30s

  # Governed knowledge refresh (K7): only sources the owner explicitly permitted.
  refresh-worker:
    image: ${EZO_API_IMAGE:-ezo-api:local}
    <<: [*hardening, *api-env]
    command: [python, -m, ezo_api.learning.refresh_cli]
    healthcheck: { disable: true }
    profiles: [refresh]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    volumes:
      - ./secrets/db-tls/ca.crt:/run/ezo-db-tls/ca.crt:ro
    networks: [backend, edge] # needs outbound HTTPS to fetch permitted sources
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 64

  web:
    build: { context: ../.., dockerfile: apps/web/Dockerfile }
    image: ${EZO_WEB_IMAGE:-ezo-web:local}
    <<: *hardening
    environment:
      EZO_API_URL: https://${EZO_API_DOMAIN:?set in primary.env}
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    networks: [edge]
    mem_limit: 384m
    pids_limit: 64

  caddy:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    environment:
      EZO_WEB_DOMAIN: ${EZO_WEB_DOMAIN:?set in primary.env}
      EZO_API_DOMAIN: ${EZO_API_DOMAIN:?set in primary.env}
      EZO_ACME_EMAIL: ${EZO_ACME_EMAIL:-}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 128m

networks:
  backend: { internal: true } # no route to the Internet; DB is only reachable here
  edge: {}

volumes:
  ezo-db:
  ezo-storage:
  caddy-data:
  caddy-config:
